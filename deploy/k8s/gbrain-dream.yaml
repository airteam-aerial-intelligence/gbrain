# Nightly dream cycle at 03:00 in spec.timeZone (patch it for yours): graph
# link extraction, fact reconciliation and consolidation (dedup into takes), embedding catch-up,
# contradiction checks, orphan detection, ideas phase. Paid LLM phases are
# capped by gbrain's own daily budgets.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gbrain-dream
  labels:
    app.kubernetes.io/name: gbrain-dream
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: gbrain-dream
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gbrain-dream
        spec:
          restartPolicy: Never
          serviceAccountName: gbrain
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dream
              image: ghcr.io/airteam-aerial-intelligence/gbrain
              args:
                - dream
                - --json
              env:
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gbrain-anthropic
                      key: ANTHROPIC_API_KEY
              envFrom:
                - secretRef:
                    name: gbrain-env
                    optional: false
                # Slack bot token: the ideas phase replies in the threads ideas came from.
                - secretRef:
                    name: gbrain-slack
                    optional: true
                - configMapRef:
                    name: gbrain-settings
                    optional: false
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: gbrain-home
                  mountPath: /home/gbrain
          volumes:
            - name: gbrain-home
              emptyDir: {}
